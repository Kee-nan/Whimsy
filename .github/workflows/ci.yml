name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whimsy_app
          POSTGRES_PASSWORD: change_this_locally
          POSTGRES_DB: whimsy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply schema to test database
        env:
          PGPASSWORD: change_this_locally
        run: |
          psql -h localhost -U whimsy_app -d whimsy_test -c "CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h localhost -U whimsy_app -d whimsy_test -f backend/db/schema.sql

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://whimsy_app:change_this_locally@localhost:5432/whimsy_test
          JWT_SECRET: ci_test_secret
          NODE_ENV: test
        run: npm test

      - name: Install and build frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: http://localhost:5000
          CI: false
        run: |
          npm ci
          npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push — just verifies the Dockerfile works)
        run: docker build -t whimsy-backend-check ./backend
      - name: Build frontend image
        run: docker build -t whimsy-frontend-check ./frontend --build-arg REACT_APP_API_URL=http://localhost:5000